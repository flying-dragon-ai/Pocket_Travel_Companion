name: Build Mini Program

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 用 npm install 而非 npm ci：vitest 内嵌的 vite 8 把 esbuild 声明为
      # peerDependency（^0.27||^0.28），而 lockfile 在 Windows 上生成时无法记录
      # Linux 平台的 @esbuild/* 可选包，npm ci 的严格校验会直接失败。
      # npm install 会在目标平台自行补齐，代价是失去 lockfile 的严格可复现性。
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run quality checks
        run: npm run lint && npm run type-check && npm run test:coverage && npm run deadcode:check

      - name: Build WeChat Mini Program
        run: npm run build:mp-weixin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mp-weixin-build
          path: dist/build/mp-weixin/
